<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Shea Sepherd - Ghost Net Fishing</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-panel { max-width: 600px; margin-bottom: 30px; }
    </style>
</h:head>

<h:body>
    <h2>Geisternetz Verwaltung (Prototyp)</h2>

    <p:growl id="messages" />

    <!-- Formular zum Melden eines neuen Netzes -->
    <h:form id="reportForm">
        <p:panel header="Neues Geisternetz melden (auch anonym möglich)" styleClass="form-panel">
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="nName" value="Name (Optional):" />
                <p:inputText id="nName" value="#{ghostNetController.neuMelderName}" />
                
                <p:outputLabel for="nTel" value="Telefon (Optional):" />
                <p:inputText id="nTel" value="#{ghostNetController.neuMelderTel}" validatorMessage="Bitte eine gültige Telefonnummer eingeben.">
                    <f:validateRegex pattern="^([0-9\+\-\s\/\(\)]+)?$" />
                </p:inputText>
                
                <p:outputLabel for="lat" value="Breitengrad (Lat):"/>
                <p:inputNumber id="lat" value="#{ghostNetController.currentNet.latitude}" decimalPlaces="6" required="true" 
                               minValue="-90.000000" maxValue="90.000000" requiredMessage="Breitengrad ist ein Pflichtfeld." />

                <p:outputLabel for="lng" value="Längengrad (Lng):"/>
                <p:inputNumber id="lng" value="#{ghostNetController.currentNet.longitude}" decimalPlaces="6" required="true" 
                               minValue="-180.000000" maxValue="180.000000" requiredMessage="Längengrad ist ein Pflichtfeld." />

                <p:outputLabel for="size" value="Geschätzte Größe (m²):"/>
                <p:inputNumber id="size" value="#{ghostNetController.currentNet.estimatedSize}" decimalPlaces="2" required="true" 
                               minValue="0.10" requiredMessage="Größe muss angegeben werden." />

                <p:commandButton value="Melden" action="#{ghostNetController.reportNet}" 
                                 update="reportForm :netTableForm:netTable messages" icon="pi pi-check" />
            </h:panelGrid>
        </p:panel>
    </h:form>

    <hr/>

    <!-- Haupttabelle zur Verwaltung und Bergungskoordination -->
    <h:form id="netTableForm">
        <p:panel header="Gemeldete Netze / Bergung koordinieren">
            
            <p:dataTable id="netTable" var="net" value="#{ghostNetController.allNets}" 
                         emptyMessage="Keine Netze gemeldet." style="margin-bottom: 20px;">
                
                <p:column headerText="ID" width="50">
                    <h:outputText value="#{net.id}" />
                </p:column>
                
                <p:column headerText="Standort">
                    <h:outputText value="Lat: #{net.latitude} / Lng: #{net.longitude}" />
                </p:column>
                
                <p:column headerText="Größe">
                    <h:outputText value="#{net.estimatedSize} m²" />
                </p:column>
                
                <p:column headerText="Status" sortBy="#{net.status}" filterBy="#{net.status}" filterMatchMode="contains">
                    <h:outputText value="#{net.status}" style="font-weight: bold;"/>
                </p:column>
                
                <p:column headerText="Gemeldet von">
                    <h:outputText value="#{net.meldendePerson != null ? net.meldendePerson.name : 'Anonym'}" />
                    
                    <h:outputText value=" (Verschollen gemeldet von: #{net.verschollenMelder.name})" 
                                  rendered="#{net.status eq 'VERSCHOLLEN' and net.verschollenMelder != null}" 
                                  style="color: red; font-size: 0.85em; display: block; margin-top: 5px;" />
                </p:column>

                <p:column headerText="Bergende Person">
                    <h:outputText value="#{net.bergendePerson != null ? net.bergendePerson.name : ''}" />
                </p:column>

                <p:column headerText="Aktion">
       
                    <p:commandButton value="Bergen" 
                            oncomplete="PF('bergungDialog').show()" 
                            rendered="#{ghostNetController.isRecoverable(net)}">
                         <f:setPropertyActionListener value="#{net}" target="#{ghostNetController.currentNet}" />
                    </p:commandButton>
                    
                    <p:commandButton value="Verschollen" 
                            oncomplete="PF('verschollenDialog').show()" 
                            rendered="#{ghostNetController.isVerschollenMeldenMoeglich(net)}"
                            icon="pi pi-question-circle">
                         <f:setPropertyActionListener value="#{net}" target="#{ghostNetController.currentNet}" />
                    </p:commandButton>

                    <p:commandButton value="Als Geborgen markieren" 
                            action="#{ghostNetController.alsGeborgenMarkieren(net)}" 
                            rendered="#{net.status eq 'BERGUNG_BEVORSTEHEND'}" 
                            update="@form" 
                            icon="pi pi-check-circle" />
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Dialog für Namenseingabe (Bergung) -->
    <p:dialog header="Für Bergung eintragen" widgetVar="bergungDialog" modal="true" resizable="false">
        <h:form id="dialogForm">
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="pName" value="Name (Pflicht):" />
                <p:inputText id="pName" value="#{ghostNetController.bergenderName}" required="true" requiredMessage="Bitte einen Namen für die Bergung angeben." />
                
                <p:outputLabel for="pTel" value="Telefon (Pflicht):" />
                <p:inputText id="pTel" value="#{ghostNetController.bergenderTel}" required="true" requiredMessage="Die Telefonnummer ist für die Bergung ein Pflichtfeld." validatorMessage="Bitte eine gültige Telefonnummer eingeben (nur Zahlen, +, -, Leerzeichen).">
                    <f:validateRegex pattern="^[0-9\+\-\s\/\(\)]+$" />
                </p:inputText>
                
                <p:commandButton value="Eintragen" action="#{ghostNetController.bergungEintragen(ghostNetController.currentNet)}" 
                update=":netTableForm:netTable messages" oncomplete="if (args) if (!args.validationFailed) PF('bergungDialog').hide();" />
            </h:panelGrid>
        </h:form>
    </p:dialog>
    
    <!-- Dialog für Verschollen melden -->
    <p:dialog header="Als verschollen melden" widgetVar="verschollenDialog" modal="true" resizable="false">
        <h:form id="verschollenForm">
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="mName" value="Name (Pflicht):" />
                <p:inputText id="mName" value="#{ghostNetController.melderName}" required="true" requiredMessage="Bitte einen Namen für die Meldung angeben." />
                
                <p:outputLabel for="mTel" value="Telefon (Pflicht):" />
                <p:inputText id="mTel" value="#{ghostNetController.melderTel}" required="true" requiredMessage="Die Telefonnummer ist hier ein Pflichtfeld." validatorMessage="Bitte eine gültige Telefonnummer eingeben (nur Zahlen, +, -, Leerzeichen).">
                    <f:validateRegex pattern="^[0-9\+\-\s\/\(\)]+$" />
                </p:inputText>
                
                <p:commandButton value="Melden" action="#{ghostNetController.alsVerschollenMelden(ghostNetController.currentNet)}" 
                update=":netTableForm:netTable messages" oncomplete="if (args) if (!args.validationFailed) PF('verschollenDialog').hide();" />
            </h:panelGrid>
        </h:form>
    </p:dialog>

</h:body>
</html>
